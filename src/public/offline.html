<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>&#128995; VoidForgeStore | Offline</title>
    <style>
        :root {
            --bg: #050816;
            --bg-deep: #02040d;
            --surface: #0c1326;
            --text: #edf3ff;
            --muted: #8e99b8;
            --line: rgba(136, 156, 211, 0.22);
            --accent: #3f8fa5;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top, rgba(91, 231, 255, 0.16) 0, transparent 26%),
                radial-gradient(circle at 80% 10%, rgba(131, 95, 255, 0.12) 0, transparent 22%),
                linear-gradient(180deg, #081022 0%, var(--bg) 38%, var(--bg-deep) 100%);
            color: var(--text);
            min-height: 100vh;
        }

        .shell {
            width: min(1080px, calc(100% - 2rem));
            margin: 0 auto;
            padding: 1.25rem 0 3rem;
        }

        .nav {
            display: flex;
            align-items: center;
            padding: 1rem 0 1.5rem;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-decoration: none;
            text-transform: uppercase;
            text-shadow: 0 0 16px rgba(91, 231, 255, 0.24);
            color: var(--text);
        }

        .brand-mark {
            width: 1.1em;
            height: 1.1em;
            border-radius: 50%;
            background: radial-gradient(circle at 38% 38%, #5be7ff 0%, #835fff 60%, #1a1060 100%);
            box-shadow: 0 0 18px 4px rgba(91, 231, 255, 0.28), 0 0 6px 1px rgba(131, 95, 255, 0.38);
            display: inline-block;
            flex-shrink: 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--line);
            border-radius: 0.75rem;
            padding: 2rem;
        }

        .hero {
            margin-top: 4rem;
            text-align: center;
            padding: 3.5rem 2rem;
        }

        h1 {
            margin: 0 0 1rem;
            font-size: 2rem;
            font-weight: 700;
        }

        .lead {
            margin: 0;
            color: var(--muted);
            font-size: 1.1rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="shell">
        <nav class="nav">
            <span class="brand">
                <span class="brand-mark"></span>
                <span>VoidForgeStore</span>
            </span>
        </nav>

        <section class="card hero">
            <h1>We'll be right back</h1>
            <p class="lead">VoidForgeStore is temporarily unavailable. Please check back shortly.</p>
        </section>
    </div>
</body>
</html>
