services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}
    container_name: voidforge-app
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./docker/runtime/storage:/var/www/html/storage
      - ./docker/runtime/cache:/var/www/html/bootstrap/cache
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    environment:
      APP_NAME: ${APP_NAME:-Voidforge}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-https://localhost:${APP_HTTPS_PORT:-8443}}
      APP_PORT: ${APP_PORT:-8000}
      APP_HTTPS_PORT: ${APP_HTTPS_PORT:-8443}
      TMPDIR: /var/www/html/storage/tmp
      CERT_MODE: ${CERT_MODE:-self-signed}
      CERT_DOMAIN: ${CERT_DOMAIN:-localhost}
      CERT_SERVER_NAMES: ${CERT_SERVER_NAMES:-localhost 127.0.0.1}
      CERT_ALT_NAMES: ${CERT_ALT_NAMES:-DNS:localhost,IP:127.0.0.1}
      CERT_CRT_PATH: ${CERT_CRT_PATH:-}
      CERT_KEY_PATH: ${CERT_KEY_PATH:-}
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-voidforge}
      DB_USERNAME: ${DB_USERNAME:-voidforge}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_STORE: ${CACHE_STORE:-file}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      STRIPE_KEY: ${STRIPE_KEY:-}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
      - "${APP_HTTPS_PORT:-8443}:8443"

  db:
    image: mariadb:11.4
    container_name: voidforge-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-voidforge}
      MARIADB_USER: ${DB_USERNAME:-voidforge}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data:
